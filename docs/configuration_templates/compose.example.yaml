services:
  inventar:
    image: inventar:latest
    container_name: inventar
    restart: unless-stopped
    networks:
      - inventar_nw
    ports:
      - '127.0.0.1:3000:3000'

  inventar_mysql:
    image: mysql:9.6.0
    container_name: inventar_mysql
    restart: unless-stopped
    networks:
      - inventar_nw
    ports:
      - '127.0.0.1:3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: "CHANGE_ME"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${MYSQL_TIMEZONE}
      # DO NOT CHANGE ANY ENVIRONMENT VARIABLES UNDER THIS LINE.
      MYSQL_DATABASE: 'inventar'
      MYSQL_USER: 'inventar'
    volumes:
      - '/etc/inventar/mysql:/var/lib/mysql'

  inventar_redis:
    image: redis:8.6.1
    container_name: inventar_redis
    restart: unless-stopped
    networks:
      - inventar_nw
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - 'inventar_redis-data:/data'
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      timeout: 3s

volumes:
  inventar_redis-data:

networks:
  inventar_nw: