services:
  inventar_mysql:
    env_file: .env
    image: mysql:9.6.0
    container_name: inventar_mysql
    restart: unless-stopped
    networks:
      - inventar_nw
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    volumes:
      - 'inventar_mysql_data:/var/lib/mysql'

  #inventar:
    #env_file: .env
